name: RSS to WordPress Automation

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no publishing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      single_feed:
        description: 'Process only a specific feed (by name)'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'

concurrency:
  group: tippah-wordpress-publisher
  cancel-in-progress: false

jobs:
  process-feeds:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Check editorial and publishing safeguards
        run: python -m pytest -q

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database from cache
        uses: actions/cache/restore@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}
          restore-keys: |
            processed-db-

      - name: Restore official source baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            data/official-source-state.json
            data/official-source-review/
          key: official-sources-${{ github.run_id }}
          restore-keys: |
            official-sources-

      - name: Collect official local reporting leads
        continue-on-error: true
        run: python -m rss_to_wp collect-official-updates --min-hours 12

      - name: Save official reporting leads for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-local-reporting-leads
          path: data/official-source-review/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run RSS to WordPress
        env:
          # OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_FALLBACK_MODEL: ${{ secrets.OPENAI_FALLBACK_MODEL || 'gpt-4.1-nano' }}
          
          # WordPress
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_POST_STATUS: ${{ secrets.WORDPRESS_POST_STATUS || 'publish' }}
          
          # Image providers (optional)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          
          # Logging
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'UTC' }}
          
          # Email notifications (optional)
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          RUN_DRY: ${{ github.event.inputs.dry_run || 'false' }}
          SINGLE_FEED: ${{ github.event.inputs.single_feed }}
        run: |
          ARGS=(--config feeds.yaml)
          
          # Add dry-run flag if specified
          if [ "$RUN_DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          
          # Add single-feed flag if specified
          if [ -n "$SINGLE_FEED" ]; then
            ARGS+=(--single-feed "$SINGLE_FEED")
          fi
          
          python -m rss_to_wp run "${ARGS[@]}"

      - name: Save database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/processed.db
          key: processed-db-${{ github.run_id }}

      - name: Save honest feed run outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-run-report
          path: data/run-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save official source baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/official-source-state.json
            data/official-source-review/
          key: official-sources-${{ github.run_id }}

      - name: Summary
        if: always()
        env:
          SUMMARY_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SUMMARY_SINGLE_FEED: ${{ github.event.inputs.single_feed || 'All feeds' }}
        run: |
          echo "## RSS to WordPress Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          printf -- '- **Dry Run**: %s\n' "$SUMMARY_DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Single Feed**: %s\n' "$SUMMARY_SINGLE_FEED" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/run-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('data/run-report.json').read_text())
          print(f"- **Feed outcome**: {report['outcome']}; errors: {report['errors']}")
          PY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/processed.db ]; then
            COUNT=$(sqlite3 data/processed.db "SELECT COUNT(*) FROM processed_entries;" 2>/dev/null || echo "N/A")
            echo "- **Total Processed Entries**: $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
