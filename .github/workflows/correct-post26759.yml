name: Correct verified post 26759 match date
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tippah-wordpress-publisher
  cancel-in-progress: false
jobs:
  correct:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pytest
      - run: python -m pytest tests/test_post26759_correction.py -q
      - name: Apply exact date correction through existing REST credentials
        env:
          WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
        run: python scripts/correct_post26759.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post26759-correction-verification
          path: data/post26759-correction.json
          retention-days: 14
